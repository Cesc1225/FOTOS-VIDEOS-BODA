<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galería Surrealista</title><link rel="stylesheet" href="styles.css"></head><body><main class="page"><section class="card"><div class="brand">GALERÍA</div><h1>Recuerdos<br><em>surrealistas</em></h1><p class="intro">Comparte tus fotografías y videos. Selecciona tus archivos y envíalos directamente a nuestra galería.</p><input id="fileInput" type="file" accept="image/*,video/*" multiple hidden><button id="selectBtn" class="select-button" type="button">＋ &nbsp; Seleccionar fotos y videos</button><div id="dropZone" class="drop-zone">También puedes arrastrar tus archivos aquí</div><div id="fileList" class="file-list"></div><button id="uploadBtn" class="upload-button" type="button" disabled>Subir archivos</button><div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div><p id="status" class="status"></p><p class="privacy">Tus archivos se almacenan en la carpeta configurada de Google Drive.</p></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
